# Available runners configured by board.cmake.
runners:
- stm32cubeprogrammer
- openocd

# Default flash runner if --runner is not given.
flash-runner: stm32cubeprogrammer

# Default debug runner if --runner is not given.
debug-runner: openocd

# Common runner configuration values.
config:
  board_dir: C:/Users/casey/github/2027-SAE-Electric-VCU/Zephyr_apps/boards/vmsboards/vms_module_rev1
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: C:/Users/casey/zephyr-sdk-1.0.0/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb.exe
  openocd: C:/Users/casey/zephyr-sdk-1.0.0/hosttools/openocd/bin/openocd.exe
  openocd_search:
    - C:/Users/casey/zephyr-sdk-1.0.0/hosttools/openocd/share/openocd/scripts

# Runner specific arguments
args:
  stm32cubeprogrammer:
    - --port=swd
    - --reset-mode=hw
  openocd:
    - --cmd-load
    - flash write_image erase
    - --cmd-verify
    - verify_image
